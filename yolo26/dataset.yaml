path: .

# Generated by scripts/convert_coco_to_yolo.py.
train: images/train
val: images/val
test:

names:
  0: fire

# These are consumed by scripts/train_fire_detection.py, not by Ultralytics
# when this file is supplied directly to the CLI.
training:
  epochs: 300
  lr0: 0.01
  lrf: 0.005
  box: 7.5
  imgsz: 800
  batch: 8
  workers: 2
  optimizer: auto
  patience: 30
  seed: 0
  # Keep geometry and flame color close to real camera footage.
  mosaic: 1.0
  close_mosaic: 10
  fliplr: 0.5
  flipud: 0.0
  scale: 0.3
  degrees: 25  # random rotation
  translate: 0.15
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.35
  erasing: 0.0
  name: fire_detection_300_960_yolo26l_ws
  project: fire_case_detection
