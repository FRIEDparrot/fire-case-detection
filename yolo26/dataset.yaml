path: .

# Generated by scripts/convert_coco_to_yolo.py.
train: images/train
val: images/val
test:

names:
  0: fire

# These are consumed by scripts/train_fire_detection.py, not by Ultralytics
# when this file is supplied directly to the CLI.
training:
  model: yolo26m.pt
  epochs: 250
  lr0: 0.005
  lrf: 0.01
  fliplr: 0.5
  flipud: 0.2
  scale: 0.3
  degrees: 15.0
  imgsz: 640
  batch: 8
  workers: 2
  optimizer: auto
  patience: 30
  seed: 0
  # Keep geometry and flame color close to real camera footage.
  mosaic: 0.1
  close_mosaic: 20
  hsv_h: 0.01
  hsv_s: 0.4
  hsv_v: 0.3
  erasing: 0.0
  name: fire_detection_250_pc
  project: fire_case_detection
