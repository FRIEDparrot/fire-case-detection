path: .

# Source-sequence-aware manifests generated by scripts/convert_coco_to_yolo.py.
train: coco_train_dataset.txt
val: coco_val_dataset.txt
test:

names:
  0: fire

# These are consumed by scripts/train_fire_detection.py, not by Ultralytics
# when this file is supplied directly to the CLI.
training:
  model: yolo26l.pt
  epochs: 100
  lr0: 0.02
  imgsz: 1280
  batch: 2
  workers: 2
  optimizer: auto
  patience: 20
  seed: 0
  name: fire_run_train01
  project: fire_case_detection